[project]
name = "value-invest-agent"
version = "0.1.0"
description = "An analyst agent trained against four years of a value-investing YouTube channel: golden calls from transcripts, point-in-time market data, forward-return validation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "nathan phillips", email = "nathanphillips369@hotmail.com" }]
dependencies = [
  "duckdb>=1.1",
  "httpx>=0.28",
  "pandas>=2.2",
  "pyarrow>=17",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "typer>=0.15",
  "rich>=13.9",
  "yfinance>=0.2.50",
]

[project.scripts]
vi = "value_invest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/value_invest"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.14.2",
  "mypy>=1.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["value_invest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
