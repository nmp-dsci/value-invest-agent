name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync
      - name: Ruff (lint)
        run: uv run ruff check src tests
      - name: Ruff (format)
        run: uv run ruff format --check src tests
      # Keyless by construction: every test mocks Supadata, yfinance, EDGAR and the
      # Agent SDK; the DuckDB fixtures are built in tmp_path.
      - name: pytest
        run: uv run pytest -q

  frontend:
    name: Frontend — type, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
